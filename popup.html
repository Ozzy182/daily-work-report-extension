<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Work Report</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>WUNDOU Work Report</h1>
        <p class="subtitle">WUNDOU task tracking</p>
      </div>

      <nav class="main-tabs" role="tablist" aria-label="Work report tabs">
        <button id="tasksTabBtn" class="tab-btn active" type="button" role="tab" aria-selected="true">▣ Tasks</button>
        <button id="reportTabBtn" class="tab-btn" type="button" role="tab" aria-selected="false">▤ Report</button>
      </nav>
    </header>

    <section id="tasksView" class="view active" role="tabpanel">
      <div class="section-heading">
        <div>
          <h2>Tasks</h2>
          <p>All tasks stay in one list. Use Assignee to choose Bibek or Nurbu.</p>
        </div>
        <button id="addTaskBtn" class="primary small" type="button">+ Add task</button>
      </div>

      <div id="taskList" class="task-list" aria-live="polite"></div>
    </section>

    <section id="reportView" class="view" role="tabpanel">
      <div class="section-heading report-heading">
        <div>
          <h2>Report</h2>
          <p>Evening uses today's Japan date. Morning automatically uses the next day.</p>
        </div>
      </div>

      <div class="report-block">
        <div class="report-block-heading">
          <h3>Evening + Morning report</h3>
          <button id="copyAllBtn" class="copy-btn" type="button">Copy all</button>
        </div>
        <div id="combinedPreview" class="message-preview combined-preview" tabindex="0" aria-label="Combined evening and morning report preview"></div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <template id="taskTemplate">
    <article class="task-card">
      <span class="drag-handle" draggable="true" title="Drag to reorder" aria-label="Drag to reorder">⋮⋮</span>

      <label class="field assignee-field">
        <span>Assignee</span>
        <select class="task-assignee">
          <option value="Bibek">Bibek</option>
          <option value="Nurbu">Nurbu</option>
        </select>
      </label>

      <label class="field id-field">
        <span>ID</span>
        <div class="id-input-wrap">
          <span>WUNDOU-</span>
          <input class="task-id" type="number" min="0" step="1" inputmode="numeric" placeholder="67" />
        </div>
      </label>

      <label class="field name-field">
        <span>Task name</span>
        <input class="task-name" type="text" placeholder="Task name" />
      </label>

      <label class="field status-percent-field">
        <span>Status %</span>
        <div class="percent-input-wrap">
          <input class="task-status-percent" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="" />
          <span>%</span>
        </div>
      </label>

      <input class="task-note" type="text" placeholder="Note" aria-label="Task note" />

      <button class="remove-btn" type="button" title="Remove task" aria-label="Remove task">×</button>
    </article>
  </template>

  <script src="popup.js"></script>
</body>
</html>
